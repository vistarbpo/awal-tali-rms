<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#1D353F" />
    <title>Awal &amp; Tali TalabOS</title>
    <!-- IBM Plex Sans Arabic — Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Full-viewport flex root so RN Web centers the tablet frame (not stuck top-left). */
      html {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background-color: #e7e2dc;
      }
      #root {
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      /* Fallback when RN Web omits fontFamily on some nodes (Arabic) */
      html[lang='ar'] #root {
        font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
