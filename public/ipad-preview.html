<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awal & Tali TalabOS — iPad Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 20px;
    }

    .label {
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* iPad 10.3" landscape (65% scale) */
    .ipad {
      position: relative;
      width: 720px;
      height: 525px;
      background: #1c1c1e;
      border-radius: 24px;
      box-shadow:
        0 0 0 2px #3a3a3c,
        0 0 0 3px #2a2a2c,
        0 30px 80px rgba(0,0,0,0.7),
        inset 0 0 0 2px #3a3a3c;
      flex-shrink: 0;
    }

    /* Side buttons */
    .ipad::before {
      content: '';
      position: absolute;
      right: -3px;
      top: 78px;
      width: 3px;
      height: 39px;
      background: #2c2c2e;
      border-radius: 0 2px 2px 0;
      box-shadow: 0 52px 0 #2c2c2e, 0 104px 0 #2c2c2e;
    }

    .ipad::after {
      content: '';
      position: absolute;
      left: -3px;
      top: 104px;
      width: 3px;
      height: 52px;
      background: #2c2c2e;
      border-radius: 2px 0 0 2px;
    }

    .screen {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    .screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Camera */
    .camera {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 10px;
      width: 8px;
      height: 8px;
      background: #2c2c2e;
      border-radius: 50%;
      border: 1px solid #3a3a3c;
    }

    .footer {
      margin-top: 28px;
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 760px) {
      .ipad {
        width: calc(100vw - 40px);
        height: calc((100vw - 40px) * 525 / 720);
        border-radius: calc(24px * (100vw - 40px) / 720);
      }
      .screen {
        top: calc(12px * (100vw - 40px) / 720);
        left: calc(12px * (100vw - 40px) / 720);
        right: calc(12px * (100vw - 40px) / 720);
        bottom: calc(12px * (100vw - 40px) / 720);
        border-radius: calc(14px * (100vw - 40px) / 720);
      }
    }
  </style>
</head>
<body>

  <p class="label">Awal &amp; Tali TalabOS &nbsp;·&nbsp; iPad Preview</p>

  <div class="ipad">
    <div class="camera"></div>
    <div class="screen">
      <iframe src="/" title="TalabOS App" allow="fullscreen"></iframe>
    </div>
  </div>

  <p class="footer">iPad 10.3" Landscape &nbsp;·&nbsp; 1080 × 810</p>

</body>
</html>
