<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awal & Tali TalabOS — iPad Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    .label {
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* iPad 10.5" landscape — 4:3 ratio */
    .ipad {
      position: relative;
      width: min(1000px, calc(100vw - 40px));
      aspect-ratio: 1112 / 834;
      background: #1c1c1e;
      border-radius: min(28px, 2.8%);
      box-shadow:
        0 0 0 2px #3a3a3c,
        0 0 0 3px #2a2a2c,
        0 30px 90px rgba(0,0,0,0.7),
        inset 0 0 0 2px #3a3a3c;
      flex-shrink: 0;
    }

    /* Volume / power buttons */
    .ipad::before {
      content: '';
      position: absolute;
      right: -3px;
      top: 14%;
      width: 3px;
      height: 7%;
      background: #2c2c2e;
      border-radius: 0 2px 2px 0;
      box-shadow: 0 130% 0 #2c2c2e;
    }

    .ipad::after {
      content: '';
      position: absolute;
      left: -3px;
      top: 18%;
      width: 3px;
      height: 10%;
      background: #2c2c2e;
      border-radius: 2px 0 0 2px;
    }

    /* Camera dot */
    .camera {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 1%;
      width: 7px;
      height: 7px;
      background: #2c2c2e;
      border-radius: 50%;
      border: 1px solid #3a3a3c;
    }

    /* Screen area */
    .screen {
      position: absolute;
      top: 1.8%;
      left: 1.8%;
      right: 1.8%;
      bottom: 1.8%;
      border-radius: min(16px, 1.6%);
      overflow: hidden;
      background: #000;
    }

    /* iframe scaled to fill screen — app designed for 1366×1024 */
    .screen iframe {
      border: none;
      display: block;
      width: 1366px;
      height: 1024px;
      transform-origin: top left;
      transform: scale(var(--scale, 1));
    }

    .footer {
      margin-top: 24px;
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <p class="label">Awal &amp; Tali TalabOS &nbsp;·&nbsp; iPad Preview</p>

  <div class="ipad" id="ipad">
    <div class="camera"></div>
    <div class="screen" id="screen">
      <iframe id="appFrame" src="/" title="TalabOS App" allow="fullscreen"></iframe>
    </div>
  </div>

  <p class="footer">iPad 10.5" Landscape &nbsp;·&nbsp; 1112 × 834</p>

  <script>
    const APP_W = 1366;
    const APP_H = 1024;

    function scaleFrame() {
      const screen = document.getElementById('screen');
      const frame  = document.getElementById('appFrame');
      const sw = screen.offsetWidth;
      const sh = screen.offsetHeight;
      const scale = Math.min(sw / APP_W, sh / APP_H);
      frame.style.transform = `scale(${scale})`;
      // Centre if there's leftover space
      frame.style.marginLeft = ((sw - APP_W * scale) / 2) + 'px';
      frame.style.marginTop  = ((sh - APP_H * scale) / 2) + 'px';
    }

    window.addEventListener('load', scaleFrame);
    window.addEventListener('resize', scaleFrame);
  </script>

</body>
</html>
