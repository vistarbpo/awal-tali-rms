<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awal & Tali TalabOS — iPad Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 20px;
    }

    .label {
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* iPad Pro 12.9" landscape proportions */
    .ipad {
      position: relative;
      width: 1108px;
      height: 808px;
      background: #1c1c1e;
      border-radius: 36px;
      box-shadow:
        0 0 0 2px #3a3a3c,
        0 0 0 3px #2a2a2c,
        0 40px 120px rgba(0,0,0,0.7),
        inset 0 0 0 2px #3a3a3c;
      flex-shrink: 0;
    }

    /* Side buttons */
    .ipad::before {
      content: '';
      position: absolute;
      right: -4px;
      top: 120px;
      width: 4px;
      height: 60px;
      background: #2c2c2e;
      border-radius: 0 3px 3px 0;
      box-shadow: 0 80px 0 #2c2c2e, 0 160px 0 #2c2c2e;
    }

    .ipad::after {
      content: '';
      position: absolute;
      left: -4px;
      top: 160px;
      width: 4px;
      height: 80px;
      background: #2c2c2e;
      border-radius: 3px 0 0 3px;
    }

    .screen {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      bottom: 18px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
    }

    .screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Camera */
    .camera {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 10px;
      width: 8px;
      height: 8px;
      background: #2c2c2e;
      border-radius: 50%;
      border: 1px solid #3a3a3c;
    }

    .footer {
      margin-top: 28px;
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 1160px) {
      .ipad {
        width: calc(100vw - 40px);
        height: calc((100vw - 40px) * 808 / 1108);
        border-radius: calc(36px * (100vw - 40px) / 1108);
      }
      .screen {
        top: calc(18px * (100vw - 40px) / 1108);
        left: calc(18px * (100vw - 40px) / 1108);
        right: calc(18px * (100vw - 40px) / 1108);
        bottom: calc(18px * (100vw - 40px) / 1108);
        border-radius: calc(20px * (100vw - 40px) / 1108);
      }
    }
  </style>
</head>
<body>

  <p class="label">Awal &amp; Tali TalabOS &nbsp;·&nbsp; iPad Preview</p>

  <div class="ipad">
    <div class="camera"></div>
    <div class="screen">
      <iframe src="/" title="TalabOS App" allow="fullscreen"></iframe>
    </div>
  </div>

  <p class="footer">iPad Pro 12.9" Landscape &nbsp;·&nbsp; 1366 × 1024</p>

</body>
</html>
