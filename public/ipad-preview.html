<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awal & Tali TalabOS — iPad Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    .label {
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 6px 10px;
    }

    .toolbar-label {
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0 6px;
    }

    .sep {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.12);
      margin: 0 4px;
    }

    .btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .btn:active { background: rgba(255,255,255,0.2); }

    .btn svg { width: 14px; height: 14px; fill: currentColor; }

    .zoom-val {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      min-width: 38px;
      text-align: center;
    }

    /* ── iPad frame ── */
    .ipad-wrap {
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center center;
    }

    .ipad {
      position: relative;
      width: 1108px;
      height: 808px;
      background: #1c1c1e;
      border-radius: 36px;
      box-shadow:
        0 0 0 2px #3a3a3c,
        0 0 0 3px #2a2a2c,
        0 40px 120px rgba(0,0,0,0.7),
        inset 0 0 0 2px #3a3a3c;
      flex-shrink: 0;
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1),
                  height 0.4s cubic-bezier(0.4,0,0.2,1),
                  border-radius 0.4s;
    }

    .ipad.portrait {
      width: 606px;
      height: 808px;
    }

    /* Side buttons — landscape */
    .ipad::before {
      content: '';
      position: absolute;
      right: -4px;
      top: 120px;
      width: 4px;
      height: 60px;
      background: #2c2c2e;
      border-radius: 0 3px 3px 0;
      box-shadow: 0 80px 0 #2c2c2e, 0 160px 0 #2c2c2e;
    }

    .ipad::after {
      content: '';
      position: absolute;
      left: -4px;
      top: 160px;
      width: 4px;
      height: 80px;
      background: #2c2c2e;
      border-radius: 3px 0 0 3px;
    }

    .screen {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      bottom: 18px;
      border-radius: 20px;
      overflow: hidden;
      background: #fafafa;
    }

    .screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .footer {
      margin-top: 24px;
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <p class="label">Awal &amp; Tali TalabOS &nbsp;·&nbsp; iPad Preview</p>

  <!-- Toolbar -->
  <div class="toolbar">
    <span class="toolbar-label">Zoom</span>
    <button class="btn" onclick="changeZoom(-0.1)">−</button>
    <span class="zoom-val" id="zoomVal">100%</span>
    <button class="btn" onclick="changeZoom(0.1)">+</button>
    <button class="btn" onclick="resetZoom()">Reset</button>
  </div>

  <!-- iPad frame -->
  <div class="ipad-wrap" id="ipadWrap">
    <div class="ipad" id="ipad">
      <div class="screen">
        <!-- embed=1: full bleed inside mockup (no double tablet frame) -->
        <iframe src="/?embed=1" title="TalabOS App" allow="fullscreen"></iframe>
      </div>
    </div>
  </div>

  <p class="footer" id="footerLabel">iPad Pro 12.9" Landscape &nbsp;·&nbsp; 1366 × 1024</p>

  <script>
    let zoom = 1;

    function changeZoom(delta) {
      zoom = Math.min(1.5, Math.max(0.3, +(zoom + delta).toFixed(1)));
      applyZoom();
    }

    function resetZoom() {
      zoom = 1;
      applyZoom();
    }

    function applyZoom() {
      document.getElementById('ipadWrap').style.transform = `scale(${zoom})`;
      document.getElementById('zoomVal').textContent = Math.round(zoom * 100) + '%';
    }
  </script>

</body>
</html>
